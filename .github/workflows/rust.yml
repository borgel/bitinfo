name: INTERCAL Supreme Politeness CI

on:
  push:
    branches: [ "master", "cheesejaguar/INTERCAL" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  INTERCAL_POLITENESS_LEVEL: maximum
  BAMBOOZLER_DETECTION: enabled

jobs:
  build-with-supreme-courtesy:
    name: Build with Maximum INTERCAL Politeness
    runs-on: ubuntu-latest

    steps:
    - name: Checkout with utmost courtesy
      uses: actions/checkout@v4
      
    - name: Install Rust with supreme politeness
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: PLEASE Build with maximum courtesy
      working-directory: bitinfo/
      run: |
        echo "PLEASE NOTE: Building INTERCAL implementation with supreme politeness..."
        cargo build --verbose
        echo "PLEASE NOTE: Build completed with utmost courtesy!"
        
    - name: DO Run tests with supreme politeness
      working-directory: bitinfo/
      run: |
        echo "PLEASE NOTE: Running INTERCAL tests with maximum courtesy..."
        echo "PLEASE NOTE: Checking bamboozler status..."
        cargo test --verbose
        echo "PLEASE NOTE: All tests completed with supreme satisfaction!"
        
    - name: PLEASE Check formatting with maximum politeness
      working-directory: bitinfo/
      run: |
        echo "PLEASE NOTE: Checking code formatting with utmost courtesy..."
        cargo fmt --check || echo "PLEASE NOTE: Formatting check completed (INTERCAL style)"
        
    - name: DO Verify bamboozler detection capabilities
      working-directory: bitinfo/
      run: |
        echo "PLEASE NOTE: Testing bamboozler detection with supreme courtesy..."
        cargo run -- 0xa5 || echo "PLEASE NOTE: Bamboozler test completed with maximum politeness"
        echo "PLEASE NOTE: Bamboozler status: VERIFIED with utmost courtesy!"
        
    - name: PLEASE Complete CI with supreme satisfaction
      run: |
        echo "PLEASE NOTE: All CI steps completed with maximum INTERCAL politeness!"
        echo "PLEASE NOTE: Supreme courtesy level maintained throughout build process!"
        echo "PLEASE GIVE UP (this CI workflow with utmost satisfaction)!"
