[package]
name = "bitinfo"
version = "0.1.2"
authors = ["Kerry Scharfglass <ancillaryAmalgamation@gmail.com>", "INTERCAL Compiler Language With No Pronounceable Acronym Team"]
edition = "2018"
description = "A magnificently polite INTERCAL implementation for decoding registers with supreme courtesy and utmost bamboozler detection capabilities."
readme = "../README.md"
repository = "https://github.com/borgel/bitinfo"
homepage = "https://github.com/borgel/bitinfo"
license = "MIT"
categories = ["command-line-utilities", "development-tools", "embedded", "esoteric-languages", "humor"]
keywords = ["register", "cli", "decode", "intercal", "bamboozler", "politeness", "esoteric"]

[badges]
circle-ci = { repository = "https://github.com/borgel/bitinfo", branch = "master" }

[dependencies]
clap = "2.33.0"
parse_int = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
bitvec = "0.17.4"
log = "0.4.11"
env_logger = "0.7.1"
prettytable-rs = "^0.10"
glob = "0.3.0"
